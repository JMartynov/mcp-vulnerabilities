[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-vulnerabilities"
version = "1.7.15"
description = "Open-Source OSV-Compliant Model Context Protocol (MCP) Vulnerability Advisory Database"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "packaging>=24.0",
    "pyyaml>=6.0",
    "mcp-fingerprints>=1.3.3",
    "rich>=13.0.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-timeout>=2.2.0",
    "ruff>=0.4.0",
    "sigstore>=3.0.0",
    "websockets>=12.0",
]

[project.scripts]
mcp-vuln = "mcp_vulnerabilities.cli:main"
mcp-vulnerabilities = "mcp_vulnerabilities.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "timeout: test timeout marker",
    "integration: integration tests requiring external binaries or network",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long (formatted separately / long URLs/regexes)
    "E701",  # multiple statements on one line (colon)
    "F403",  # star imports in compatibility shims
    "F541",  # f-string without placeholders
    "F841",  # local variable assigned but never used
    "W291",  # trailing whitespace
    "W293",  # blank line contains whitespace
]

[tool.uv.sources]
# mcp-fingerprints = { path = "../mcp-fingerprints", editable = true }
