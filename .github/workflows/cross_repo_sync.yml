name: Cross-Repo Synchronization

on:
  schedule:
    - cron: "0 5 * * *" # Daily at 05:00 UTC (staggered after mcp-fingerprints 04:00)
  workflow_dispatch:
  repository_dispatch:
    types: [upstream_fingerprints_updated]

permissions:
  contents: write
  actions: write

concurrency:
  group: mcp-vuln-data-sync
  cancel-in-progress: false

jobs:
  cross-repo-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Dispatch Payload Version (if available)
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "Upstream Fingerprints Version: ${{ github.event.client_payload.upstream_version }}" >> $GITHUB_STEP_SUMMARY
          echo "Passports Count: ${{ github.event.client_payload.passports_count }}" >> $GITHUB_STEP_SUMMARY

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" uv
          
      - name: Backup Passports and Vulnerabilities for Delta Check
        run: |
          if [ -f "data/passports.json.gz" ]; then
            cp data/passports.json.gz data/passports_backup.json.gz
          fi
          rm -rf data/vulnerabilities_backup
          cp -r data/vulnerabilities data/vulnerabilities_backup || true

      - name: Fetch Latest Passports from mcp-fingerprints (Cross-Repo Sync)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "import os; from mcp_vulnerabilities.sync_manager import CrossRepoSyncManager; CrossRepoSyncManager().fetch_latest_passports(github_token=os.environ.get('GITHUB_TOKEN'))"

      - name: Run Cross-Repo Correlation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m mcp_vulnerabilities.cli correlate || true

      - name: Check for Deltas
        id: delta_check
        run: |
          python scripts/check_deltas.py >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT
          rm -rf data/vulnerabilities_backup data/passports_backup.json.gz

      - name: Build Web Explorer Static Data & Release Feeds
        run: |
          python -m mcp_vulnerabilities.site_builder --workers 4
          python -m mcp_vulnerabilities.updates_builder

      - name: Compile Consolidated Snapshot
        run: |
          python -m mcp_vulnerabilities.snapshot data/vulnerabilities vulnerabilities.json.gz

      - name: Run E2E Integration Tests
        run: |
          pytest tests/test_e2e_cross_repo_sync.py -v

      - name: Bump Version and Release if Delta Detected
        if: github.ref == 'refs/heads/main' && steps.delta_check.outputs.delta_detected == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_DISPATCH_PAT: ${{ secrets.REPO_DISPATCH_PAT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_VERSION=$(python scripts/bump_version.py --dry-run)
          python scripts/bump_version.py --apply
          python -m mcp_vulnerabilities.site_builder --workers 4
          python -m mcp_vulnerabilities.updates_builder --version "${NEW_VERSION}"
          
          git add pyproject.toml src/mcp_vulnerabilities/__init__.py docs/data/ data/passports.json.gz vulnerabilities.json.gz
          if [ -d "data/vulnerabilities" ]; then
            git add data/vulnerabilities/
          fi
          
          git diff --staged --quiet || git commit -m "chore(release): bump version to v${NEW_VERSION} after cross-repo sync"
          git tag "v${NEW_VERSION}"
          
          pushed=false
          for i in 1 2 3 4 5; do
            if git push origin main --tags; then
              pushed=true
              break
            fi
            echo "Push attempt $i failed. Retrying in $((i * 5))s..."
            sleep $((i * 5))
            git pull --rebase origin main || true
          done
          if [ "$pushed" = false ]; then
            echo "Failed to push after multiple attempts"
            exit 1
          fi

          sha256sum vulnerabilities.json.gz > SHA256SUMS.txt
          gh release create "v${NEW_VERSION}" vulnerabilities.json.gz SHA256SUMS.txt --title "v${NEW_VERSION}: Automated MCP Vulnerabilities & Advisories Release" --generate-notes
          rm -f SHA256SUMS.txt
          gh workflow run release.yaml --ref "v${NEW_VERSION}"
          gh workflow run docker.yml --ref "v${NEW_VERSION}"
          gh workflow run sign_release.yml --ref "v${NEW_VERSION}"
          if [ -n "${REPO_DISPATCH_PAT}" ]; then
            for target in JMartynov/verityredteam-free JMartynov/verityredteam; do
              GH_TOKEN="${REPO_DISPATCH_PAT}" gh api "repos/${target}/dispatches" -f event_type=upstream_vulnerabilities_updated -f "client_payload[upstream_version]=${NEW_VERSION}" -f "client_payload[source]=mcp-vulnerabilities"
            done
          else
            echo "::warning::REPO_DISPATCH_PAT not configured; skipping downstream repository_dispatch"
          fi
          gh workflow run daily_web_audit.yml || true
          gh workflow run pages.yml || true

      - name: Commit & Push Canonical Vulnerability Updates Directly to Main
        if: github.ref == 'refs/heads/main' && steps.delta_check.outputs.delta_detected != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/passports.json.gz vulnerabilities.json.gz docs/data/
          if [ -d "data/vulnerabilities" ]; then
            git add data/vulnerabilities/
          fi
          if ! git diff --staged --quiet; then
            git commit -m "chore(sync): automated cross-repo sync of passports.json.gz [skip ci]"
            pushed=false
            for i in 1 2 3 4 5; do
              if git push origin main; then
                pushed=true
                break
              fi
              echo "Push attempt $i failed. Retrying in $((i * 5))s..."
              sleep $((i * 5))
              git pull --rebase origin main || true
            done
            if [ "$pushed" = false ]; then
              echo "Failed to push after multiple attempts"
              exit 1
            fi
            gh workflow run daily_web_audit.yml || true
            gh workflow run pages.yml || true
          fi
