name: Cross-Repo Synchronization

on:
  schedule:
    - cron: "0 4 * * *" # Daily at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cross-repo-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          
      - name: Fetch Latest Passports from mcp-fingerprints (Cross-Repo Sync)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "import os; from mcp_vulnerabilities.sync_manager import CrossRepoSyncManager; CrossRepoSyncManager().fetch_latest_passports(github_token=os.environ.get('GITHUB_TOKEN'))"

      - name: Compile Consolidated Snapshot
        run: |
          python -m mcp_vulnerabilities.snapshot data/vulnerabilities vulnerabilities.json.gz

      - name: Run Cross-Repo Correlation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m mcp_vulnerabilities.cli correlate || true

      - name: Run E2E Integration Tests
        run: |
          pytest tests/test_e2e_cross_repo_sync.py -v

      - name: Commit & Push Canonical Vulnerability Updates Directly to Main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/passports.json.gz
          git diff --staged --quiet || git commit -m "chore(sync): automated cross-repo sync of passports.json.gz [skip ci]"
          git push origin main
