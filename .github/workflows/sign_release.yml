name: Sign Release
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build pyyaml
      - name: Prepare assets and generate manifest
        run: |
          if [ -f "docs/data/vulnerabilities.json" ] && [ ! -f "docs/data/vulnerabilities.json.gz" ]; then
            gzip -k docs/data/vulnerabilities.json
          fi
          if [ ! -d "dist" ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
            python -m build --outdir dist
          fi
          python3 -c "import sys; sys.path.insert(0, 'src'); from mcp_vulnerabilities.attestation.manifest import generate_catalog_manifest; generate_catalog_manifest('docs/data')"
      - uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: >-
            dist/*.whl
            dist/*.tar.gz
            docs/data/vulnerabilities.json.gz
            docs/data/mcp_catalog_index.json
            docs/data/manifest.json
