name: Daily MCP Vulnerability Ingestion & Sync

on:
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force version bump and release'
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [upstream_fingerprints_updated]
  push:
    paths:
      - "tests/fixtures/osv/**"
      - "src/mcp_vulnerabilities/**"

permissions:
  contents: write

jobs:
  sync-mcp-vulnerabilities:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.commit_push.outputs.release_created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" uv
          
      - name: Fetch Latest Passports from mcp-fingerprints (Cross-Repo Sync)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "import os; from mcp_vulnerabilities.sync_manager import CrossRepoSyncManager; CrossRepoSyncManager().fetch_latest_passports(github_token=os.environ.get('GITHUB_TOKEN'))"

      - name: Run Multi-Registry MCP Server Discovery
        run: |
          python -m mcp_vulnerabilities.cli discover --catalog-file data/mcp_servers.json

      - name: Run Asynchronous Catalog Version Enrichment
        run: |
          python -m mcp_vulnerabilities.cli enrich --catalog-file data/mcp_servers.json --limit 500 --workers 10

      - name: Run MCP Ingestion & Normalization Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          python -m mcp_vulnerabilities.cli sync --live-api

      - name: Validate OSV Dataset Integrity & Schemas
        run: |
          python -m mcp_vulnerabilities.cli validate --dir data/vulnerabilities
          pytest -v

      - name: Compile Consolidated Snapshot & Threat Feeds
        run: |
          python -m mcp_vulnerabilities.snapshot data/vulnerabilities vulnerabilities.json.gz

      - name: Export OSV Dataset Bucket
        run: |
          python -m mcp_vulnerabilities.cli export-osv --data-dir data/vulnerabilities --output-dir dist/osv

      - name: Run Cross-Repo Correlation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m mcp_vulnerabilities.cli correlate || true

      - name: Build Web Explorer Static Data & Release Feeds
        run: |
          python -m mcp_vulnerabilities.site_builder
          python -m mcp_vulnerabilities.updates_builder

      - name: Commit and push updated security advisories & snapshot
        id: commit_push
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are substantive vulnerability or passport changes
          VULN_CHANGES=$(git status --porcelain data/vulnerabilities/ data/passports.json.gz data/mcp_servers.json | grep -v "sync_state.json" | grep -v "index.json" || true)

          git add data/mcp_servers.json data/ vulnerabilities.json.gz
          git add -f dist/osv/ 2>/dev/null || true

          if ! git diff --staged --quiet; then
            if [ -n "$VULN_CHANGES" ] || [ "${{ inputs.force_release }}" = "true" ]; then
              # Bump version
              NEW_VERSION=$(python scripts/bump_version.py --dry-run)
              python scripts/bump_version.py --apply
              python -m mcp_vulnerabilities.site_builder
              python -m mcp_vulnerabilities.updates_builder --version "${NEW_VERSION}"
              git add pyproject.toml src/mcp_vulnerabilities/__init__.py docs/data/
              git commit -m "chore(release): bump version to v${NEW_VERSION} and sync MCP security advisories"
              git tag "v${NEW_VERSION}"
              echo "release_created=true" >> "$GITHUB_OUTPUT"
              echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
            else
              python -m mcp_vulnerabilities.site_builder
              python -m mcp_vulnerabilities.updates_builder
              git add docs/data/
              git commit -m "chore(osv): automated daily sync of MCP security advisories, feeds and web explorer data [skip ci]"
              echo "release_created=false" >> "$GITHUB_OUTPUT"
            fi

            pushed=false
            for i in 1 2 3 4 5; do
              if git push origin main --tags; then
                pushed=true
                break
              fi
              echo "Push attempt $i failed. Retrying in $((i * 5))s..."
              sleep $((i * 5))
              git pull --rebase origin main || true
            done
            if [ "$pushed" = false ]; then
              echo "Failed to push after multiple attempts"
              exit 1
            fi

            if [ -n "$VULN_CHANGES" ] || [ "${{ inputs.force_release }}" = "true" ]; then
              gh release create "v${NEW_VERSION}" --title "v${NEW_VERSION}: Automated MCP Vulnerabilities & Advisories Release" --generate-notes
            fi
          else
            echo "release_created=false" >> "$GITHUB_OUTPUT"
          fi

  pypi-release:
    needs: sync-mcp-vulnerabilities
    if: needs.sync-mcp-vulnerabilities.outputs.release_created == 'true'
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/release.yaml
