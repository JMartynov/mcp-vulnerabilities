name: Daily MCP Vulnerability Ingestion & Sync

on:
  schedule:
    - cron: "0 3 * * *" # Daily at 03:00 UTC
  workflow_dispatch:
  push:
    paths:
      - "tests/fixtures/osv/**"
      - "src/mcp_vulnerabilities/**"

permissions:
  contents: write

jobs:
  sync-mcp-vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run MCP Ingestion & Normalization Pipeline
        run: |
          python -m mcp_vulnerabilities.cli sync --live-api

      - name: Validate OSV Dataset Integrity & Schemas
        run: |
          python -m mcp_vulnerabilities.cli validate --dir data/vulnerabilities
          pytest -v

      - name: Compile Consolidated Snapshot
        run: |
          python -m mcp_vulnerabilities.snapshot data/vulnerabilities vulnerabilities.json.gz

      - name: Commit & Push Canonical Vulnerability Updates Directly to Main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/vulnerabilities/ vulnerabilities.json.gz
          git diff --staged --quiet || git commit -m "chore(osv): automated daily sync of MCP security advisories and snapshot [skip ci]"
          git push origin main
